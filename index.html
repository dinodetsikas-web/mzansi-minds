<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mzansi Minds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column (max 64rem), navy header band, cards only for the working surface (question, Mimi, banners). */
:root {
  --navy: #14283E; --gold: #F2B544; --cream: #F4F0E7; --white: #FFFFFF;
  --bg: #F4F0E7; --surface: #FFFFFF; --sunk: #EBE5D7; --ink: #14283E; --muted: #55627A; --line: #DAD2C1;
  --band: #14283E; --band-ink: #F4F0E7; --accent: #F2B544; --accent-ink: #14283E; --accent-soft: #FBE7BC;
  --btn2-bg: #14283E; --btn2-ink: #FFFFFF; --focus: #1F5FA8;
  --ok: #24704F; --ok-bg: #DDF0E6; --prac: #2A5D9A; --prac-bg: #DFE9F6; --gap: #A8432B; --gap-bg: #F7E2DB; --na: #5F6672; --na-bg: #E7E3DA;
  --stripe: #F2B54433;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1826; --surface: #14283E; --sunk: #102133; --ink: #F4F0E7; --muted: #A9B5C4; --line: #2B425C;
    --band: #08111C; --band-ink: #F4F0E7; --accent: #F2B544; --accent-ink: #14283E; --accent-soft: #3A3220;
    --btn2-bg: #F4F0E7; --btn2-ink: #14283E; --focus: #F2B544;
    --ok: #74D0A4; --ok-bg: #163829; --prac: #96BDF0; --prac-bg: #1A3352; --gap: #F2A18A; --gap-bg: #44241C; --na: #B0B6BF; --na-bg: #233243;
    --stripe: #F2B54422; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1826; --surface: #14283E; --sunk: #102133; --ink: #F4F0E7; --muted: #A9B5C4; --line: #2B425C;
  --band: #08111C; --band-ink: #F4F0E7; --accent: #F2B544; --accent-ink: #14283E; --accent-soft: #3A3220;
  --btn2-bg: #F4F0E7; --btn2-ink: #14283E; --focus: #F2B544;
  --ok: #74D0A4; --ok-bg: #163829; --prac: #96BDF0; --prac-bg: #1A3352; --gap: #F2A18A; --gap-bg: #44241C; --na: #B0B6BF; --na-bg: #233243;
  --stripe: #F2B54422; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.55; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 800; }
h2 { font-size: clamp(1.35rem, 3.2vw, 1.75rem); font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; max-width: 65ch; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.band { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.band-inner { max-width: 64rem; margin: 0 auto; padding: 0.6rem 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; }
.brand { display: flex; align-items: center; gap: 0.55rem; font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; background: none; border: 0; color: inherit; cursor: pointer; padding: 0.25rem 0; }
.mark { width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-weight: 800; font-size: 0.95rem; flex: none; }
.nav { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-left: auto; }
.nav button { background: none; border: 0; color: var(--band-ink); font: 500 0.88rem var(--f-body); padding: 0.45rem 0.65rem; border-radius: 999px; cursor: pointer; min-height: 40px; opacity: 0.85; }
.nav button:hover { opacity: 1; background: #ffffff14; }
.nav button[aria-current="page"] { background: var(--gold); color: var(--navy); opacity: 1; }
.presenter-flag { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); }

main { max-width: 64rem; margin: 0 auto; padding-inline: 16px; padding-block: 1.75rem 3rem; display: grid; gap: 2rem; }
main:focus { outline: none; }
footer { max-width: 64rem; margin: 0 auto; padding-inline: 16px; padding-block: 1.25rem 2rem; color: var(--muted); font-size: 0.82rem; border-top: 1px solid var(--line); }

.stack { display: grid; gap: 1rem; }
.stack-s { display: grid; gap: 0.5rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lead { font-size: 1.2rem; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }

.btn { font: 600 1rem var(--f-body); border-radius: 999px; padding: 0.7rem 1.25rem; min-height: 48px; border: 2px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-dark { background: var(--btn2-bg); color: var(--btn2-ink); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--ink); }
.btn-danger { background: var(--gap); color: var(--surface); }
.btn-s { min-height: 40px; padding: 0.45rem 0.9rem; font-size: 0.9rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

/* Welcome */
.hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2rem; align-items: center; }
.hero > * { min-width: 0; }
.hero h1 span { display: block; color: var(--muted); font-size: 0.55em; font-weight: 600; margin-top: 0.4rem; }
.promise { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; border-left: 4px solid var(--accent); padding-left: 0.75rem; }
.hero-fig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.25rem; display: grid; gap: 0.75rem; }
.hero-fig figcaption { font-size: 0.92rem; color: var(--muted); }
.hero-fig .sum { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; }
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
.steps3 > div { display: grid; gap: 0.35rem; align-content: start; min-width: 0; }
.stepnum { font-family: var(--f-display); font-weight: 800; color: var(--accent-ink); background: var(--accent); width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; }
.real-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem 1.5rem; padding: 0; margin: 0; list-style: none; }
.real-list li { display: flex; gap: 0.5rem; min-width: 0; }
.real-list li::before { content: "✓"; color: var(--ok); font-weight: 700; }
.section-head { display: grid; gap: 0.35rem; }

/* Learner cards */
.learners { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem; display: grid; gap: 0.6rem; align-content: start; min-width: 0; }
.lcard .name { display: flex; align-items: center; gap: 0.6rem; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--sunk); border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; flex: none; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.15rem 0.5rem; border-radius: 999px; background: var(--sunk); color: var(--muted); }

/* Question */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(1rem, 3vw, 1.75rem); display: grid; gap: 1.1rem; }
.qmeta { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; }
.progress { font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--muted); }
.why { font-size: 0.92rem; background: var(--sunk); border-radius: 10px; padding: 0.6rem 0.8rem; }
.qtext { font-family: var(--f-display); font-size: clamp(1.3rem, 3.5vw, 1.7rem); font-weight: 700; line-height: 1.3; max-width: 34ch; }
.visual { display: flex; justify-content: flex-start; }
.visual svg { max-width: 100%; height: auto; }
.answer-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: stretch; }
.answer-row input { font: 600 1.35rem var(--f-body); padding: 0.55rem 0.85rem; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 11rem; max-width: 100%; min-height: 52px; font-variant-numeric: tabular-nums; }
.answer-row input:focus { border-color: var(--focus); outline: none; }
.choices { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.choice { font: 600 1.15rem var(--f-body); padding: 0.6rem 1.1rem; min-height: 52px; min-width: 4.5rem; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.choice[aria-pressed="true"] { border-color: var(--ink); background: var(--accent-soft); }
.feedback { border-radius: 12px; padding: 0.85rem 1rem; display: grid; gap: 0.45rem; }
.feedback.good { background: var(--ok-bg); color: var(--ink); border-left: 5px solid var(--ok); }
.feedback.notyet { background: var(--gap-bg); color: var(--ink); border-left: 5px solid var(--gap); }
.feedback.info { background: var(--prac-bg); color: var(--ink); border-left: 5px solid var(--prac); }
.hintbox { background: var(--accent-soft); border-radius: 12px; padding: 0.75rem 0.9rem; font-size: 0.95rem; }
details summary { cursor: pointer; font-weight: 600; }
.cue { border: 2px dashed var(--accent); border-radius: 12px; padding: 0.6rem 0.85rem; font-size: 0.9rem; background: var(--stripe); }
.cue b { font-variant-numeric: tabular-nums; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 999px; white-space: nowrap; }
.pill::before { font-size: 0.75rem; }
.s-demonstrated { background: var(--ok-bg); color: var(--ok); }
.s-demonstrated::before { content: "●"; }
.s-practising { background: var(--prac-bg); color: var(--prac); }
.s-practising::before { content: "◐"; }
.s-gap { background: var(--gap-bg); color: var(--gap); }
.s-gap::before { content: "▲"; }
.s-not_assessed { background: var(--na-bg); color: var(--na); }
.s-not_assessed::before { content: "○"; }

/* Skill ladder */
.ladder { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.rung { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 1rem; padding: 0.75rem 1rem; border-top: 1px solid var(--line); align-items: center; }
.rung:first-child { border-top: 0; }
.rung .meta { grid-column: 1 / -1; font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rung.focus { background: var(--accent-soft); }
.rung .nm { font-weight: 600; min-width: 0; }
.rung .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 0.78rem; }

.rec { background: var(--btn2-bg); color: var(--btn2-ink); border-radius: var(--r); padding: clamp(1rem, 3vw, 1.6rem); display: grid; gap: 0.75rem; }
.rec .eyebrow { color: inherit; opacity: 0.75; }
.rec ul { margin: 0; padding-left: 1.1rem; font-size: 0.92rem; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
.two > * { min-width: 0; }

/* Mimi */
.mimi { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 1.5rem; align-items: start; }
.chat { display: grid; gap: 0.75rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem; max-height: 34rem; overflow-y: auto; }
.msg { display: flex; gap: 0.6rem; align-items: flex-start; }
.msg .bubble { background: var(--sunk); border-radius: 4px 14px 14px 14px; padding: 0.65rem 0.85rem; display: grid; gap: 0.5rem; min-width: 0; }
.msg.me { justify-content: flex-end; }
.msg.me .bubble { background: var(--accent-soft); border-radius: 14px 4px 14px 14px; }
.msg .label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.draft { border: 1px dashed var(--gap); border-radius: 8px; padding: 0.35rem 0.55rem; font-size: 0.78rem; color: var(--gap); }
.tools { display: flex; flex-wrap: wrap; gap: 0.5rem; }

/* Passport */
.passport-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; align-items: end; border-bottom: 3px solid var(--ink); padding-bottom: 1rem; }
.stamp { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: 2px solid var(--ok); color: var(--ok); padding: 0.25rem 0.6rem; border-radius: 8px; transform: rotate(-2deg); }
.tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.tabs button { font: 600 0.9rem var(--f-body); padding: 0.45rem 0.9rem; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; min-height: 40px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 4.5rem 1fr; gap: 0.75rem; padding: 0.55rem 0; border-top: 1px solid var(--line); font-size: 0.92rem; }
.timeline time { color: var(--muted); font-variant-numeric: tabular-nums; }
.timeline li > span { min-width: 0; }

/* Tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 0.55rem 0.75rem; border-top: 1px solid var(--line); vertical-align: middle; }
thead th { border-top: 0; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--sunk); }
.heat td.c { text-align: center; padding: 0.35rem; }
.heat .cell { display: inline-block; width: 1.9rem; height: 1.6rem; border-radius: 5px; line-height: 1.6rem; font-size: 0.75rem; }
.heat th:first-child, .heat td:first-child { position: sticky; left: 0; background: var(--surface); }
.heat thead th:first-child { background: var(--sunk); }

.sample-banner { background: repeating-linear-gradient(135deg, var(--stripe) 0 12px, transparent 12px 24px), var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 0.9rem 1rem; display: grid; gap: 0.3rem; }
.sample-banner strong { font-family: var(--f-display); font-size: 1.1rem; }
.legend { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.bars { display: grid; gap: 0.6rem; }
.barrow { display: grid; grid-template-columns: 11rem 1fr 3rem; gap: 0.75rem; align-items: center; font-size: 0.9rem; }
.barrow > span { min-width: 0; }
.track { height: 0.9rem; border-radius: 999px; background: var(--sunk); overflow: hidden; display: flex; }
.track i { display: block; height: 100%; }

/* Presenter */
.timer { font-family: var(--f-display); font-size: clamp(2.5rem, 9vw, 4rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.timer.late { color: var(--gap); }
.runsheet { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.6rem; counter-reset: s; }
.runsheet li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0.85rem 1rem; display: grid; grid-template-columns: 2.2rem 1fr auto; gap: 0.75rem; align-items: start; }
.runsheet li > div { min-width: 0; }
.runsheet .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.8rem; }
.runsheet .say { font-style: italic; font-size: 0.92rem; color: var(--muted); }
.confirm { background: var(--gap-bg); border-radius: 12px; padding: 0.85rem 1rem; display: grid; gap: 0.6rem; }
.switch { display: flex; align-items: center; gap: 0.6rem; cursor: pointer; font-weight: 500; }
.switch input { width: 1.3rem; height: 1.3rem; accent-color: var(--navy); }
select { font: 500 1rem var(--f-body); padding: 0.55rem 0.75rem; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); min-height: 46px; max-width: 100%; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem; display: grid; gap: 0.75rem; }

/* SVG visuals */
.v-box { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.v-box.on { fill: var(--accent-soft); stroke: var(--accent); }
.v-dot { fill: var(--ink); }
.v-part { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.v-part.on { fill: var(--accent); }
.v-text { fill: var(--muted); font: 600 13px var(--f-body); }

@media (max-width: 760px) {
  .hero, .two, .mimi { grid-template-columns: 1fr; }
  .steps3 { grid-template-columns: 1fr; }
  .learners, .real-list { grid-template-columns: 1fr; }
  .barrow { grid-template-columns: 1fr 3rem; }
  .barrow .track { grid-column: 1 / -1; grid-row: 2; }
  .nav { margin-left: 0; width: 100%; }
  .runsheet li { grid-template-columns: 2rem 1fr; }
  .runsheet li .go { grid-column: 2; }
}
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.track i::before { content: none; }
.heat .cell::before { font-size: 0.8rem; }

</style>
</head>
<body>

<header class="band"><div class="band-inner">
  <button class="brand" data-act="go" data-v="welcome" aria-label="Mzansi Minds home"><span class="mark" aria-hidden="true">M</span>Mzansi Minds</button>
  <span class="presenter-flag" id="pflag" hidden>Presenter cues on</span>
  <nav class="nav" id="nav" aria-label="Main"></nav>
</div></header>
<main id="app" tabindex="-1"></main>
<footer>Mzansi Minds · working prototype for the Trinityhouse Little Falls SDG 4 campaign · fictional learners only · nothing leaves this device · "Don't Promise Tomorrow. Build It Today."</footer>
<script>
/* Mzansi Minds engine: pure, deterministic functions. No AI, no network. */
(function (root) {
  'use strict';

  var SKILLS = {
    PV:   { id: 'PV',   name: 'Place value',                      prereqs: [],             order: 1 },
    MUL:  { id: 'MUL',  name: 'Multiplication',                   prereqs: ['PV'],         order: 2 },
    DIV:  { id: 'DIV',  name: 'Division and equal sharing',       prereqs: ['MUL'],        order: 3 },
    FRAC: { id: 'FRAC', name: 'What a fraction means',            prereqs: ['DIV'],        order: 4 },
    FOQ:  { id: 'FOQ',  name: 'Fraction of an amount',            prereqs: ['DIV', 'FRAC'], order: 5 },
    EQV:  { id: 'EQV',  name: 'Equivalent and comparing fractions', prereqs: ['FRAC'],     order: 6, stretch: true },
    WORD: { id: 'WORD', name: 'Fraction word problems',           prereqs: ['FOQ'],        order: 7, stretch: true }
  };
  var CHAIN = ['PV', 'MUL', 'DIV', 'FRAC', 'FOQ'];
  var STRETCH = ['EQV', 'WORD'];
  var ALL = CHAIN.concat(STRETCH);
  var GOAL = 'FOQ';
  var MAX_QUESTIONS = 12;

  var AREA = {
    PV: 'Whole numbers: place value',
    MUL: 'Whole numbers: multiplication',
    DIV: 'Whole numbers: division',
    FRAC: 'Common fractions',
    FOQ: 'Common fractions: fractions of whole numbers',
    EQV: 'Common fractions: equivalent fractions and comparing',
    WORD: 'Common fractions: solving problems in context'
  };
  function caps(skill) {
    return {
      status: 'provisional',
      area: 'Grade 5 · Numbers, Operations and Relationships · ' + AREA[skill],
      note: 'Developer mapping. Not yet checked against the official CAPS document.'
    };
  }
  var REVIEW = 'Answer checked by automated test; teacher review pending';

  function item(o) {
    o.grade = 5;
    o.language = 'en';
    o.topic = SKILLS[o.skillId].name;
    o.prerequisiteSkillIds = SKILLS[o.skillId].prereqs.slice();
    o.capsReference = caps(o.skillId);
    o.reviewStatus = REVIEW;
    o.acceptedAnswers = o.answerType === 'choice' ? [o.answer]
      : o.answerType === 'fraction' ? [o.answer[0] + '/' + o.answer[1], 'any equivalent fraction']
      : [String(o.answer)];
    o.misconceptions = o.misconceptions || [];
    return o;
  }

  /* Diagnostic items: order inside each skill is easiest first. */
  var ITEMS = [

  function parseAnswer(raw) {
    var s = String(raw == null ? '' : raw).replace(/ /g, ' ').trim().toLowerCase();

    s = s.replace(/(\d)\s+(?=\d{3}(\D|$))/g, '$1');

    if (m) {
      if (+m[2] === 0) return { ok: false, reason: 'invalid' };
      return { ok: true, value: (+m[1]) / (+m[2]) };
    }
    s = s.replace(',', '.');
    if (/^\d+(\.\d+)?$/.test(s)) return { ok: true, value: parseFloat(s) };
    return { ok: false, reason: 'invalid' };

  }

  /* ---------- Mimi ---------- */
  function startTutor(L, p) {
    var rec = MM.recommend(L.evidence);
    var skill = rec.skillId || MM.GOAL;
    L.tutor = { skillId: skill, idx: 0, hints: 0, attempts: 0, recorded: false, itemDone: false, shown: false, msgs: [] };
    var intro = 'Hi ' + p.alias + '. Let\'s practise ' + lower(skill) + ' together.';
    if (rec.kind === 'gap') intro += ' Your check-in answers suggest this is a good place to start, before more fractions.';
    if (rec.kind === 'next') intro += ' You answered everything correctly, so here are two challenge problems.';
    say(L, 'mimi', intro);
    say(L, 'mimi', MM.LESSONS[skill].guide, { kind: 'guide' });

  }
  function say(L, who, text, extra) {
    var m = Object.assign({ who: who, text: text }, extra || {});
    L.tutor.msgs.push(m);
    if (L.tutor.msgs.length > 60) L.tutor.msgs.shift();
  }
  function tutorItem(L) { return MM.BY_ID[MM.LESSONS[L.tutor.skillId].practice[L.tutor.idx]]; }

  function vMimi() {
    var p = profile(S.learnerId); if (!p) return needLearner();
    var L = learner();
    if (!L.diag || !L.diag.done) {
      return '<section class="stack"><span class="eyebrow">Mimi</span><h1 tabindex="-1">Mimi needs the check-in first</h1>' +
        '<p class="lead">Mimi chooses what to practise from ' + esc(p.alias) + '\'s check-in answers, so the check-in comes first.</p>' +
        '<div class="row"><button class="btn btn-primary" data-act="go" data-v="check">Go to the check-in</button></div></section>';
    }
    if (!L.tutor) { startTutor(L, p); save(); }
    var t = L.tutor, lesson = MM.LESSONS[t.skillId], it = tutorItem(L);

    } else {
      panel = '<div class="qcard"><div class="qmeta"><span class="eyebrow">Practice ' + (t.idx + 1) + ' of ' + lesson.practice.length + '</span>' +

    }

      '<button class="btn btn-dark btn-s" data-act="tHint">Give me a hint</button>' +
      '<button class="btn btn-ghost btn-s" data-act="tDiff">Explain differently</button>' +
      '<button class="btn btn-ghost btn-s" data-act="tExample">Show an example</button>' +
      '<button class="btn btn-ghost btn-s" data-act="tLang">Explain in my language</button>' +
      '<button class="btn btn-ghost btn-s" data-act="tRetry">Let me try again</button></div>' +
      '<p class="small muted">Mimi only talks about this maths topic and never asks for personal details. Explanations are written and checked in advance; live AI is coming later.</p></div>';
    var chat = '<div class="chat" id="chat" aria-live="polite" aria-label="Conversation with Mimi">' + t.msgs.map(function (m) {
      if (m.who === 'me') return '<div class="msg me"><div class="bubble"><span class="label">' + esc(p.alias) + '</span><p>' + esc(m.text) + '</p></div></div>';
      return '<div class="msg"><span class="mark" aria-hidden="true">M</span><div class="bubble"><span class="label">Mimi' + (m.kind === 'guide' ? ' · think about this' : '') + '</span>' +
        (m.draft ? '<span class="draft">Draft isiZulu translation. Needs checking by an isiZulu-speaking teacher.</span>' : '') +
        '<p' + (m.draft ? ' lang="zu"' : '') + '>' + esc(m.text) + '</p>' + visual(m.visual) + '</div></div>';
    }).join('') + '</div>';
    return '<section class="stack"><div class="section-head"><span class="eyebrow">' + esc(p.alias) + ' · Practise with Mimi</span>' +
      '<h1 tabindex="-1">' + esc(MM.SKILLS[t.skillId].name) + '</h1></div>' +
      '<div class="mimi"><div class="stack">' + panel + tools + '</div>' + chat + '</div></section>';
  }

  function tutorAction(act) {
    var p = profile(S.learnerId), L = learner(), t = L.tutor; if (!t) return;
    var lesson = MM.LESSONS[t.skillId], it = tutorItem(L);
    if (act === 'tHint') {
      say(L, 'me', 'Give me a hint.');
      if (t.itemDone) { say(L, 'mimi', 'You have finished this question. Tap "Next question" when you are ready.'); }
      else {
        t.hints++;
        var h = it.hints[t.hints - 1];
        say(L, 'mimi', h || 'That was my last hint for this one. Try "Show an example", then have another go.');
        logEvent(L, 'Asked Mimi for hint ' + Math.min(t.hints, it.hints.length) + ' on: ' + it.questionText, 'hint');
      }
    } else if (act === 'tDiff') {
      say(L, 'me', 'Can you explain it differently?');
      say(L, 'mimi', lesson.differently);
      logEvent(L, 'Asked for a different explanation (' + MM.SKILLS[t.skillId].name + ')', 'hint');
    } else if (act === 'tExample') {
      say(L, 'me', 'Show me an example.');
      say(L, 'mimi', lesson.example.text, { visual: lesson.example.visual });
      logEvent(L, 'Looked at a worked example (' + MM.SKILLS[t.skillId].name + ')', 'hint');
    } else if (act === 'tLang') {
      say(L, 'me', 'Explain in my language.');
      if (S.lang === 'zu' && lesson.zu) {
        say(L, 'mimi', lesson.zu, { draft: true });
        logEvent(L, 'Read the draft isiZulu explanation (' + MM.SKILLS[t.skillId].name + ')', 'hint');
      } else {
        var why = S.lang === 'zu' ? 'The isiZulu explanation for ' + lower(t.skillId) + ' is not ready yet.' : LANGS[S.lang].replace(' (coming later)', '') + ' explanations are coming later.';
        say(L, 'mimi', why + ' Here it is in English: ' + lesson.differently);
        logEvent(L, 'Asked for another language; English shown because no translation is ready', 'hint');
      }
    } else if (act === 'tRetry') {
      say(L, 'me', 'Let me try again.');
      say(L, 'mimi', t.itemDone ? 'Good idea. Tap "Next question" for a new one.' : 'Take your time. Read the question again, then type your answer.');
      T.focusInput = true; T.msg = null; T.choice = null;
    } else if (act === 'tutorSteps') {
      say(L, 'mimi', 'Here are the steps: ' + it.workedSolution + ' Next time, try starting with the first step on your own.');
      if (!t.recorded) { recordPractice(L, t, it, false, '(steps shown)'); }
      logEvent(L, 'Mimi showed the steps for: ' + it.questionText, 'hint');
      t.itemDone = true;
    } else if (act === 'tutorNext') {
      t.idx++; t.hints = 0; t.attempts = 0; t.recorded = false; t.itemDone = false;
      say(L, 'mimi', 'Here is another one. You can ask for a hint any time.');
    } else if (act === 'tutorRestart') {
      startTutor(L, p);
    }
    save(); render();
    var c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight;
  }
  function recordPractice(L, t, it, correct, answer) {
    L.evidence.push({ itemId: it.id, skillId: it.skillId, correct: correct, hints: t.hints, answer: answer, source: 'practice', t: Date.now() });
    t.recorded = true;
  }
  function submitTutor(raw) {
    var p = profile(S.learnerId), L = learner(), t = L.tutor, it = tutorItem(L);
    var res = MM.checkAnswer(it, raw);
    if (!res.valid) { T.msg = res.message; render(); focusAnswer(); return; }
    T.msg = null; T.choice = null;
    say(L, 'me', res.given);
    var first = !t.recorded;
    if (first) recordPractice(L, t, it, res.correct, res.given);
    logEvent(L, 'Practice · ' + it.questionText + ' → "' + res.given + '" (' + (res.correct ? 'correct' : 'not yet') +
      (t.hints ? ', after ' + t.hints + ' hint' + (t.hints > 1 ? 's' : '') : '') + (first ? '' : ', retry') + ')', res.correct ? 'right' : 'wrong');
    if (res.correct) {
      say(L, 'mimi', (t.attempts ? 'Yes! You got there. ' : 'Yes, that\'s right. ') + 'Here is why: ' + it.workedSolution +
        (t.hints && first ? ' You used a hint, so this counts as practising. Next time, try it without one.' : ''));
      t.itemDone = true;
    } else {
      t.attempts++;
      say(L, 'mimi', (res.misconception || 'Not yet. Read the question again, or ask for a hint.') +
        (t.attempts >= 2 ? ' If you are stuck, tap "Show me the steps".' : ''));
    }
    save(); render();
    var c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight;
    if (!t.itemDone) focusAnswer();
  }

  /* ---------- Passport ---------- */
  function vPassport() {
    var withData = MM.LEARNERS.filter(function (l) { return hasData(l.id); });
    var id = S.passportFor && hasData(S.passportFor) ? S.passportFor : (S.learnerId && hasData(S.learnerId) ? S.learnerId : (withData[0] && withData[0].id));
    var head = '<div class="section-head"><span class="eyebrow">Learning Passport</span><h1 tabindex="-1">Learning Passport</h1></div>';
    if (!id) {
      return '<section class="stack">' + head + '<div class="panel"><h2>No learning recorded yet</h2>' +
        '<p>The Passport only shows answers that were actually given on this device. Choose a learner and start the check-in, and every answer will appear here.</p>' +
        '<div class="row"><button class="btn btn-primary" data-act="go" data-v="learners">Choose a learner</button></div></div></section>';
    }

    var tabs = '<div class="tabs" role="group" aria-label="Choose a learner">' + MM.LEARNERS.map(function (l) {
      return '<button data-act="passport" data-v="' + l.id + '" aria-pressed="' + (l.id === id) + '"' + (hasData(l.id) ? '' : ' disabled') + '>' + esc(l.alias) + '</button>';
    }).join('') + '</div>';
    var rows = MM.ALL.map(function (k) {
      var s = MM.skillStatus(L.evidence, k);
      return '<tr><td>' + esc(MM.SKILLS[k].name) + '</td><td>' + pill(s.status) + '</td><td>' + s.n + '</td><td>' + s.correct + '</td><td>' + (s.correct - s.unaided) + '</td></tr>';
    }).join('');
    var tl = L.log.map(function (e) { return '<li><time>' + clock(e.t) + '</time><span>' + esc(e.text) + '</span></li>'; }).join('');
    return '<section class="stack">' + tabs +
      '<div class="passport-head"><div class="stack-s"><span class="eyebrow">Learning Passport · ' + (id === 'guest' ? 'Guest learner' : 'Fictional learner · Grade 5') + '</span>' +
      '<h1 tabindex="-1">' + esc(p.alias) + '</h1></div><span class="stamp">Real answers from this device</span></div>' +
      '<div class="two"><div class="stack"><div class="rec"><span class="eyebrow">Next step</span><h2>' + esc(rec.title) + '</h2><p>' + esc(rec.reason) + '</p></div>' +
      '<div class="panel"><h2 style="font-size:1.1rem">So far</h2><p>' + diagN + ' check-in answer' + (diagN === 1 ? '' : 's') + ' · ' + pracN + ' practice answer' + (pracN === 1 ? '' : 's') +
      ' (' + pracRight + ' right first time)</p><p class="small muted">Print and download: coming later.</p></div></div>' +
      '<div class="stack-s"><h2 style="font-size:1.15rem">Skills</h2><div class="tablewrap"><table><thead><tr><th>Skill</th><th>Status</th><th>Answers</th><th>Right</th><th>With hints</th></tr></thead><tbody>' +
      rows + '</tbody></table></div></div></div>' +
      '<div class="stack-s"><h2 style="font-size:1.15rem">Activity, in order</h2><ul class="timeline">' + tl + '</ul></div></section>';
  }

  /* ---------- Teacher ---------- */
  var ACTIVITIES = {
    PV: 'Build numbers with place-value cards, then read them aloud in thousands, hundreds, tens and units.',

  function vTeacher() {

      '<div class="sample-banner" role="note"><strong>SAMPLE DATA: a made-up class of 24</strong><span>These are not real learners or real school results. They show what a teacher would see once a class has used Mzansi Minds.</span></div>' +
      '<div class="two"><div class="stack-s"><h2 style="font-size:1.15rem">Sample class by skill</h2><div class="legend">' +

  /* ---------- Presenter ---------- */
  var RUN = [
    { at: '0:00', title: 'Open with the promise', say: 'Most campaigns tell you what they will do. I wanted to show you.', act: 'go', v: 'welcome', btn: 'Welcome page' },

  ];
  function elapsed() { var t = S.timer; return t.elapsed + (t.running ? Date.now() - t.startedAt : 0); }

  function vPresent() {

    return '<section class="stack"><div class="section-head"><span class="eyebrow">Presenter mode</span><h1 tabindex="-1">Five-minute demo run sheet</h1>' +

      '<div class="two"><div class="panel"><span class="eyebrow">Timer</span><div class="timer" id="timer">' + fmt(elapsed()) + '</div>' +

      '<div class="row"><button class="btn btn-ghost btn-s" data-act="askReset" data-v="presentation">Reset presentation</button></div>' + confirm + '</div></div>' +
      '<ol class="runsheet">' + RUN.map(function (r, i) {
        return '<li><span class="stepnum">' + (i + 1) + '</span><div class="stack-s"><span class="t">' + r.at + '</span><h3>' + esc(r.title) + '</h3><p class="say">"' + esc(r.say) + '"</p></div>' +
          (r.act ? '<button class="btn btn-dark btn-s go" data-act="' + r.act + '" data-v="' + r.v + '">' + esc(r.btn) + '</button>' : '<span></span>') + '</li>';
      }).join('') + '</ol>' +
      '<div class="panel"><h2 style="font-size:1.1rem">Thabo\'s answers for a predictable run</h2><p class="small">Check-in: 12, 45, 20, 27, 56, 60, 3/8, 2/5. Practice: hint, then 8; then 6.</p>' +
      '<p class="small muted">Naledi (all right): 15, 5, 4, 2/3, 20, 8. Sipho (fractions): 17, 12, 6, 4, 3/5, 3/5.</p></div></section>';
  }

  /* ---------- Settings ---------- */
  function vSettings() {
    var confirm = T.confirm === 'all'
      ? '<div class="confirm" role="alert"><p>Delete every answer, the Passport records and all settings on this device?</p><div class="row">' +
        '<button class="btn btn-danger btn-s" data-act="resetAll">Yes, reset everything</button><button class="btn btn-ghost btn-s" data-act="cancel">Cancel</button></div></div>'
      : '';
    var nDiag = MM.ITEMS.filter(function (i) { return i.use === 'diagnostic'; }).length;
    return '<section class="stack"><div class="section-head"><span class="eyebrow">Settings</span><h1 tabindex="-1">Settings and reset</h1></div>' +
      '<div class="two"><div class="stack">' +
      '<div class="panel"><label for="lang"><b>Language for "Explain in my language"</b></label><select id="lang" data-act="lang">' +
      Object.keys(LANGS).map(function (k) { return '<option value="' + k + '"' + (S.lang === k ? ' selected' : '') + '>' + LANGS[k] + '</option>'; }).join('') +
      '</select><p class="small muted">isiZulu explanations are drafts for division, fractions and fractions of amounts. They still need checking by an isiZulu-speaking teacher. Other languages fall back to English.</p></div>' +
      '<div class="panel"><label class="switch"><input type="checkbox" data-act="cues"' + (S.presenter ? ' checked' : '') + '> Presenter cues</label></div>' +
      '<div class="panel"><h2 style="font-size:1.1rem">Reset the demo</h2><p class="small">Removes all answers and Passport records from this browser.</p>' +
      '<div class="row"><button class="btn btn-danger btn-s" data-act="askReset" data-v="all">Reset demo</button></div>' + confirm + '</div></div>' +
      '<div class="panel"><h2 style="font-size:1.1rem">Known limits of this version</h2><ul class="stack-s small" style="padding-left:1.1rem;margin:0">' +
      '<li>Question bank: ' + nDiag + ' check-in and ' + (MM.ITEMS.length - nDiag) + ' practice questions for Grade 5. Every answer is checked by an automated test; a teacher review is still pending.</li>' +
      '<li>Curriculum links to CAPS are provisional developer mappings, not yet checked against the official document.</li>' +
      '<li>Mimi uses written, checked explanations. A live AI tutor needs a secure server and is coming later.</li>' +
      '<li>Records live only in this browser. Clearing browser data removes them.</li>' +
      '<li>Before any use with real learners, POPIA and parental consent requirements must be reviewed.</li>' +
      '<li>Grades 4 and 6, printing the Passport, and more languages are coming later.</li></ul></div></div></section>';
  }

  /* ---------- Render and events ---------- */
  var VIEWS = { welcome: vWelcome, learners: vLearners, home: vHome, check: vCheck, results: vResults, mimi: vMimi, passport: vPassport, teacher: vTeacher, present: vPresent, settings: vSettings };
  var NAV = [['welcome', 'Home'], ['learners', 'Learners'], ['passport', 'Passport'], ['teacher', 'Teacher'], ['present', 'Present'], ['settings', 'Settings']];
  var NAV_GROUP = { home: 'learners', check: 'learners', results: 'learners', mimi: 'learners' };

  function render() {
    var view = VIEWS[S.view] ? S.view : 'welcome';
    var cur = NAV_GROUP[view] || view;
    document.getElementById('nav').innerHTML = NAV.map(function (n) {
      return '<button data-act="go" data-v="' + n[0] + '"' + (cur === n[0] ? ' aria-current="page"' : '') + '>' + n[1] + '</button>';
    }).join('');
    document.getElementById('pflag').hidden = !S.presenter;
    var main = document.getElementById('app');
    main.innerHTML = VIEWS[view]();
    if (T.lastView !== view) {
      T.lastView = view;
      var h = main.querySelector('h1');
      if (h && document.activeElement && document.activeElement !== document.body) { try { h.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    }
    if (T.focusInput) { T.focusInput = false; focusAnswer(); }
    var nb = document.getElementById('nextBtn'); if (nb && T.fb) nb.focus();
    var c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight;
  }
  function focusAnswer() { var i = document.getElementById('ans'); if (i) i.focus(); }

  function pick(id) { S.learnerId = id; learner(id); }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (b.tagName === 'SELECT' || (b.tagName === 'INPUT' && b.type === 'checkbox')) return;
    switch (act) {
      case 'go': go(v); break;
      case 'pick': pick(v); go('home'); break;
      case 'startCheck': pick(v); go('check'); break;
      case 'passport': S.passportFor = v; go('passport'); break;
      case 'choose': T.choice = v; render(); break;
      case 'checkHint': {
        var L = learner(), it = MM.currentItem(L.diag);
        T.hints++; T.hintTexts.push(it.hints[T.hintTexts.length]);
        logEvent(L, 'Asked for a hint on: ' + it.questionText, 'hint'); save(); render(); break;
      }
      case 'checkNext': T.fb = null; T.msg = null; render(); focusAnswer(); break;
      case 'askClearLearner': T.confirm = 'learner'; render(); break;
      case 'clearLearner': delete S.learners[S.learnerId]; T.confirm = null; T.fb = null; T.hintItem = null; save(); go('home'); break;
      case 'askReset': T.confirm = v; render(); break;
      case 'cancel': T.confirm = null; render(); break;
      case 'resetPresentation':
        S.learners = {}; S.learnerId = null; S.passportFor = null; S.timer = { running: false, startedAt: 0, elapsed: 0 };
        T.fb = null; T.hintItem = null; T.confirm = null; save(); render(); break;
      case 'resetAll': S = fresh(); T.fb = null; T.hintItem = null; T.confirm = null; save(); go('welcome'); break;
      case 'timer':
        if (S.timer.running) { S.timer.elapsed = elapsed(); S.timer.running = false; }
        else { S.timer.running = true; S.timer.startedAt = Date.now(); }
        save(); render(); break;
      case 'timerReset': S.timer = { running: false, startedAt: 0, elapsed: 0 }; save(); render(); break;
      default:
        if (/^(t[A-Z]|tutor)/.test(act)) tutorAction(act);
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, act = el.getAttribute && el.getAttribute('data-act');
    if (act === 'lang') { S.lang = el.value; save(); }
    if (act === 'cues') { S.presenter = el.checked; save(); render(); }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, raw = f.querySelector('#ans') ? f.querySelector('#ans').value : T.choice;
    if (f.id === 'checkForm') {
      var L = learner(), it = MM.currentItem(L.diag);
      var r = MM.answerDiagnostic(L.diag, L.evidence, it.id, raw, T.hints);
      if (!r.valid) { T.msg = r.message; render(); focusAnswer(); return; }
      L.diag = r.diagnostic; L.evidence = r.evidence;
      logEvent(L, 'Check-in · ' + it.questionText + ' → "' + r.entry.answer + '" (' + (r.result.correct ? 'correct' : 'not yet') + (T.hints ? ', with a hint' : '') + ')', r.result.correct ? 'right' : 'wrong');
      if (L.diag.done) logEvent(L, 'Finished the check-in. Suggested next step: ' + MM.recommend(L.evidence).title, 'finish');
      T.fb = { itemId: it.id, correct: r.result.correct, hints: T.hints, given: r.entry.answer };
      T.msg = null; T.choice = null;
      save(); render();
    } else if (f.id === 'tutorForm') {
      submitTutor(raw);
    }
  });
  setInterval(function () {
    var el = document.getElementById('timer');
    if (el && S.timer.running) { var ms = elapsed(); el.textContent = fmt(ms); el.classList.toggle('late', ms > 300000); }
  }, 500);

  window.MMApp = { state: function () { return S; } };
  render();
})();

</script>

</body>
</html>
